[package]
name = "root"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "r00t"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
quick-xml = "0.42.0"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
signal-hook = "0.4.5"
tempfile = "3.27.0"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "local-offset", "parsing"] }
toml = "1.1.8"
url = "2.5.8"
ureq = "3.5.0"
yaml-rust2 = "0.13.0"

[dev-dependencies]
filetime = "0.2.29"
