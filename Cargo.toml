[package]
name = "root"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }
quick-xml = "0.42.0"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting"] }
toml = "1.1.8"
ureq = "3.5.0"
yaml-rust2 = "0.13.0"

[dev-dependencies]
tempfile = "3.27.0"
