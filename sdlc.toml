# sdlc.toml — convencion por repo (ticket 11). `files` es el TECHO (patrones fnmatch) de lo que el pipeline puede
# escribir; un payload solo lo acota. Sin accept_cmd el repo no entra. approve_accept: un humano aprueba el test
# de aceptacion que escribe la etapa 1 antes de gastar (ticket 12 D5).
# Otros lenguajes: `ext`, `compile_cmd` (G3 y test-compile), `lint_cmd`, `accept_test` (ruta con {slug}).
accept_cmd = "python -m pytest -q"
suite = ["tests", "-q", "-rfE", "-p", "no:cacheprovider", "--basetemp", "C:/Users/map12/AppData/Local/Temp/pyt-sdlc-wt"]
ext = ["py"]
approve_accept = true
usd_max = 3.0
# Techo curado 2026-09-15: el engine y los scripts; de tests solo el ratchet de capas (los cableos lo achican).
files = [
    "mmorch/*.py",
    "scripts/*.py",
    "tests/test_capas.py",
]
